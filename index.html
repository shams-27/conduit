<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1300">
    <link rel="icon" type="image/png" sizes="32x32"
        href="https://img.icons8.com/?size=100&id=aczgoYL07gXY&format=png&color=000000">
    <title>Conduit</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="dashboard-view">

        <header class="full-width-header">
            <div class="header-container">

                <h1>Conduit</h1>

                <div class="header-bookmark-tray">
                    <ul id="custom-links-list" class="tray-links"></ul>
                    <button id="open-modal-btn" class="tray-add-btn" title="Add Quick Bookmark">＋</button>
                </div>

                <div class="hub-dropdown-container" id="diu-hub-dropdown">
                    <div class="hub-trigger" id="hub-trigger">
                        <span>DIU Hub</span>
                        <span class="hub-arrow">▼</span>
                    </div>
                    <div class="hub-menu" id="hub-menu">
                        <!-- Populated from HUB_ITEMS in data.js -->
                    </div>
                </div>

                <!-- Populated by renderCalendarWidget() in calendar.js -->
                <div class="calendar-dropdown-container" id="calendar-dropdown"></div>

            </div>
        </header>

        <div class="container">
            <div class="main-layout">

                <main class="resources-grid" id="resources-grid">

                    <!-- Cards populated from RESOURCE_CARDS in data.js -->

                    <!-- Tray bookmark modal -->
                    <div id="add-link-modal" class="modal-overlay">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h3>Add New Bookmark</h3>
                                <button id="close-modal-btn" class="close-btn">&times;</button>
                            </div>
                            <form id="bookmark-form">
                                <div class="input-group">
                                    <input type="text" id="link-name" placeholder="Link Name (e.g., Uni Portal)"
                                        required>
                                </div>
                                <div class="input-group">
                                    <input type="url" id="link-url" placeholder="URL (https://...)" required>
                                </div>
                                <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Save
                                    Link</button>
                            </form>
                        </div>
                    </div>

                </main>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        &copy; 2026 <a href="https://github.com/shams-27" target="_blank" rel="noopener">Shams Kabir</a>
    </footer>

    <script src="data.js"></script>
    <script src="main.js"></script>
    <script src="resource-grid.js"></script>
    <script src="hub-menu.js"></script>
    <script src="bookmarks.js"></script>
    <script src="calendar.js"></script>
</body>

</html>
